<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMAR SHOP Admin</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f6f8;margin:0;color:#111827}.wrap{max-width:1100px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.field{margin:8px 0}.field label{display:block;font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#111827;color:#fff}.light{background:#eef0f3}.danger{background:#fee4e2;color:#b42318}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
</style></head><body><div class="wrap">
<header><h1>AMAR SHOP — Admin</h1><button id="logout" class="btn light" style="display:none">Logout</button></header>
<div id="login" class="card"><h2>Admin Login</h2><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn dark" onclick="login()">Login</button><p id="loginMsg"></p></div>
<div id="panel" style="display:none"><div id="stats" class="card">Loading dashboard…</div>
<div class="card"><h2>Product Control</h2><div class="row"><div class="field"><label>Product name</label><input id="pname"></div><div class="field"><label>Price</label><input id="price" type="number"></div></div>
<div class="row"><div class="field"><label>Old price</label><input id="old" type="number"></div><div class="field"><label>Stock</label><input id="stock" type="number"></div></div>
<div class="row"><div class="field"><label>Category</label><input id="cat"></div><div class="field"><label>Sizes (comma separated)</label><input id="sizes" placeholder="M,L,XL,XXL"></div></div>
<div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Image URL (or upload below)</label><input id="image"></div>
<input id="file" type="file" accept="image/*" onchange="uploadImage()"><br><br><button class="btn dark" onclick="createProduct()">Add Product</button></div>
<div class="card"><h2>Products</h2><div id="products"></div></div>
<div class="card"><h2>Orders</h2><div id="orders"></div></div></div></div>
<script>
let products=[];
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||"Error");return d}
async function check(){try{await api("/api/admin/me");show()}catch{}}
async function login(){try{await api("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});show()}catch(e){loginMsg.textContent=e.message}}
function show(){login.style.display="none";panel.style.display="block";logout.style.display="block";loadProducts();loadOrders()}
logout.onclick=async()=>{await api("/api/admin/logout",{method:"POST"});location.reload()}
async function loadProducts(){products=await api("/api/admin/products");productsDiv();loadStats()}
async function loadStats(){const s=await api("/api/admin/stats");document.getElementById("stats").innerHTML=`<b>Dashboard</b><br>Products: ${s.products} &nbsp; Orders: ${s.orders} &nbsp; Pending: ${s.pending} &nbsp; Delivered revenue: ৳${Number(s.revenue).toLocaleString()}` }
function productsDiv(){productsEl=document.getElementById("products");productsEl.innerHTML=products.map(p=>`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${esc(p.name)}</b> — ৳${p.price} — Stock ${p.stock}<br><button class="btn danger" onclick="del(${p.id})">Deactivate</button></div>`).join("")}
async function createProduct(){const p={name:pname.value,price:+price.value,oldPrice:+old.value,stock:+stock.value,category:cat.value,sizes:sizes.value.split(",").map(x=>x.trim()).filter(Boolean),description:desc.value,image:image.value};await api("/api/admin/products",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)});alert("Saved");loadProducts()}
async function del(id){if(confirm("Deactivate product?")){await api("/api/admin/products/"+id,{method:"DELETE"});loadProducts()}}
async function uploadImage(){const f=file.files[0];if(!f)return;const fd=new FormData();fd.append("image",f);const d=await api("/api/admin/upload",{method:"POST",body:fd});image.value=d.url}
async function loadOrders(){const o=await api("/api/admin/orders");document.getElementById("orders").innerHTML=`<table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Change</th></tr>${o.map(x=>`<tr><td>${x.order_number}</td><td>${esc(x.customer_name)}<br>${esc(x.phone)}</td><td>৳${x.total}</td><td>${x.status}</td><td><select onchange="status(${x.id},this.value)">${["PENDING","CONFIRMED","PROCESSING","SHIPPED","DELIVERED","CANCELLED","RETURNED"].map(s=>`<option ${s==x.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table>`}
async function status(id,s){await api("/api/admin/orders/"+id+"/status",{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({status:s})});loadOrders()}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
check();
</script></body></html>
